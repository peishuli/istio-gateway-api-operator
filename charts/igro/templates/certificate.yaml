{{- if and .Values.webhook.enabled .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "igro.webhookCertSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "igro.labels" . | nindent 4 }}
spec:
  secretName: {{ include "igro.webhookCertSecret" . }}
  dnsNames:
    - {{ include "igro.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "igro.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- toYaml .Values.certManager.issuerRef | nindent 4 }}
{{- end }}
