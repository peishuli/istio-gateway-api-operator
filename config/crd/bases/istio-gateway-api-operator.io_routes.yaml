                    maximum: 99
                    minimum: 1
                    type: integer
                required:
                - backend
                - weight
                type: object
              cors:
                description: CORS is the CORS policy applied to all rules. Omit to
                  disable CORS.
                properties:
                  allowHeaders:
                    description: AllowHeaders is a list of allowed request headers.
                    items:
                      type: string
                    type: array
                  allowMethods:
                    description: AllowMethods is a list of allowed HTTP methods.
