        description: Route is the Schema for the routes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RouteSpec defines the desired state of Route.
            properties:
              auth:
                description: Auth configures Istio RequestAuthentication + AuthorizationPolicy
                  resources.
                properties:
                  audiences:
                    description: Audiences limits accepted JWT audiences.
                    items:
                      type: string
                    type: array
                  forwardOriginalToken:
                    description: ForwardOriginalToken keeps the original token in
                      upstream requests.
                    type: boolean
                  issuer:
                    description: Issuer is the JWT issuer URL or identifier.
                    type: string
                  jwksUri:
                    description: JWKSURI optionally overrides OpenID discovery with
                      explicit JWKS URI.
                    type: string
                required:
                - issuer
                type: object
              canary:
                description: Canary configures weighted traffic splitting to a secondary
                  backend.
                properties:
                  backend:
                    description: Backend defines the canary target service.
                    properties:
                      protocol:
                        default: HTTP
                        description: Protocol is the protocol the backend expects.
                          HTTPS triggers a DestinationRule.
                        enum:
                        - HTTP
                        - HTTPS
                        type: string
                      serviceName:
                        description: ServiceName is the target Kubernetes Service
