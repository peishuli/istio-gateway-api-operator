                    host:
                      description: Host is the hostname to route (e.g., app.example.com).
                      type: string
                    path:
                      default: /
                      description: Path is the path prefix to match.
                      type: string
                  required:
                  - backend
                  - host
                  type: object
                minItems: 1
                type: array
              sslRedirect:
                default: true
                description: SSLRedirect enables per-host HTTP→HTTPS redirect HTTPRoutes.
                type: boolean
              timeout:
                description: Timeout is the request timeout (e.g., 60s, 300s). Applied
                  to all rules.
                type: string
