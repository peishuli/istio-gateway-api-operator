                          enum:
                          - HTTP
                          - HTTPS
                          type: string
                        serviceName:
                          description: ServiceName is the target Kubernetes Service
                            name.
                          type: string
                        servicePort:
                          description: ServicePort is the target Service port number.
                          format: int32
                          type: integer
                      required:
                      - serviceName
                      - servicePort
                      type: object
                    headers:
                      description: Headers applies per-rule request/response header
                        operations.
                      properties:
                        request:
                          description: Request manipulates request headers before
                            forwarding.
                          properties:
                            add:
                              additionalProperties:
                                type: string
                              description: Add appends values to existing headers.
                              type: object
                            remove:
                              description: Remove deletes headers by name.
                              items:
                                type: string
                              type: array
                            set:
                              additionalProperties:
                                type: string
                              description: Set overwrites headers with the given values.
                              type: object
                          type: object
                        response:
                          description: Response manipulates response headers before
                            returning to clients.
                          properties:
                            add:
                              additionalProperties:
                                type: string
                              description: Add appends values to existing headers.
                              type: object
                            remove:
                              description: Remove deletes headers by name.
                              items:
                                type: string
                              type: array
                            set:
                              additionalProperties:
                                type: string
                              description: Set overwrites headers with the given values.
                              type: object
                          type: object
