                    type: string
                  namespace:
                    default: istio-system
                    description: Namespace is the Gateway resource namespace.
                    type: string
                type: object
              maxBodySize:
                description: MaxBodySize is the max request body in bytes (e.g., 734003200
                  for 700MB). Applied to all rules.
                type: string
              rateLimit:
                description: RateLimit configures local token-bucket rate limiting
                  at the gateway.
                properties:
                  burst:
                    description: Burst is the maximum token bucket size. Defaults
                      to requestsPerUnit when omitted.
                    format: int32
                    minimum: 1
                    type: integer
                  requestsPerUnit:
                    description: RequestsPerUnit is the number of allowed requests
                      for each unit.
                    format: int32
                    minimum: 1
                    type: integer
                  unit:
                    description: Unit is the replenishment window for RequestsPerUnit.
                    enum:
                    - Second
                    - Minute
                    - Hour
                    type: string
                required:
                - requestsPerUnit
                - unit
                type: object
              retries:
                description: Retries configures Istio retry policy for all rules.
                properties:
                  attempts:
                    description: Attempts is the number of retries for a request.
                      0 disables retries.
                    format: int32
                    minimum: 0
                    type: integer
                  perTryTimeout:
                    description: PerTryTimeout is timeout per retry attempt (e.g.,
                      2s).
                    type: string
                  retryOn:
                    description: RetryOn is a comma-separated list of retry conditions.
                    type: string
                type: object
              rules:
                description: Rules is a list of routing rules. Each rule maps a host+path
                  to a backend service.
                items:
                  description: RouteRule defines a single routing rule mapping a host+path
                    to a backend.
                  properties:
                    backend:
                      description: Backend defines the target service.
                      properties:
                        protocol:
                          default: HTTP
                          description: Protocol is the protocol the backend expects.
